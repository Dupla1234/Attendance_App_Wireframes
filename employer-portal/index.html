<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendancePro | Employer Portal</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7f9fb; margin: 0; }
      .auth-wrap { min-height: 100vh; display: grid; place-items: center; }
      .card { width: min(420px, calc(100% - 24px)); background: white; border: 1px solid #e0e3e5; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
      input, button { width: 100%; padding: 12px 14px; border-radius: 10px; margin-top: 8px; border: 1px solid #d6d9dd; }
      button { background: #004ac6; color: white; border: none; font-weight: 700; cursor: pointer; }
      .hidden { display: none; }
      .dashboard { max-width: 1100px; margin: 0 auto; padding: 24px; }
      .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .panel { background: white; border: 1px solid #e0e3e5; border-radius: 12px; padding: 20px; }
      .status { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
      .success { background: rgba(16, 185, 129, 0.12); color: #10b981; }
      .warning { background: rgba(188, 72, 0, 0.12); color: #bc4800; }
      .danger { background: rgba(186, 26, 26, 0.12); color: #ba1a1a; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #e0e3e5; padding: 10px 8px; text-align: left; }
    </style>
  </head>
  <body>
    <div id="login-screen" class="auth-wrap">
      <div class="card">
        <h1>AttendancePro</h1>
        <p>Employer Portal</p>
        <form id="login-form">
          <label>Employer ID</label>
          <input id="userId" type="text" value="ADMIN-100" required />

          <label style="display:block; margin-top: 14px;">Password</label>
          <input id="password" type="password" value="admin123" required />

          <button type="submit" style="margin-top: 18px;">Sign In</button>
        </form>
      </div>
    </div>

    <div id="dashboard-screen" class="dashboard hidden">
      <h1>Monitoring Dashboard</h1>
      <div class="stats">
        <div class="panel">
          <p>Employees Active</p>
          <h2 id="employees-active">--</h2>
        </div>
        <div class="panel">
          <p>Present Today</p>
          <h2 id="present-today">--</h2>
        </div>
        <div class="panel">
          <p>Late Arrivals</p>
          <h2 id="late-arrivals">--</h2>
        </div>
        <div class="panel">
          <p>Out of Bounds</p>
          <h2 id="out-of-bounds">--</h2>
        </div>
      </div>

      <div style="margin-top:24px; display:grid; gap:16px; grid-template-columns: repeat(2, minmax(0,1fr));">
        <div class="panel">
          <h3>Employees</h3>
          <table>
            <thead>
              <tr><th>Name</th><th>ID</th><th>Branch</th><th>Status</th></tr>
            </thead>
            <tbody id="employees-body"></tbody>
          </table>
        </div>

        <div class="panel">
          <h3>Alerts</h3>
          <ul id="alerts-list"></ul>
        </div>
      </div>
    </div>

    <script>
      const API_URL = window.API_URL || 'http://localhost:4000';
      const tokenKey = 'attendance_employer_token';

      const loginScreen = document.getElementById('login-screen');
      const dashboardScreen = document.getElementById('dashboard-screen');
      const loginForm = document.getElementById('login-form');

      const setAuthState = (token) => {
        localStorage.setItem(tokenKey, token);
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
      };

      const loadDashboard = async () => {
        const token = localStorage.getItem(tokenKey);
        if (!token) return;

        const [metricsResponse, employeesResponse] = await Promise.all([
          fetch(`${API_URL}/api/admin/dashboard`, {
            headers: { Authorization: `Bearer ${token}` }
          }),
          fetch(`${API_URL}/api/admin/employees`, {
            headers: { Authorization: `Bearer ${token}` }
          })
        ]);

        const metricsData = await metricsResponse.json();
        const employeesData = await employeesResponse.json();

        document.getElementById('employees-active').textContent = metricsData.metrics.employeesActive;
        document.getElementById('present-today').textContent = metricsData.metrics.presentToday;
        document.getElementById('late-arrivals').textContent = metricsData.metrics.lateArrivals;
        document.getElementById('out-of-bounds').textContent = metricsData.metrics.outOfBounds;

        document.getElementById('employees-body').innerHTML = (employeesData.employees || []).map((item) => `
          <tr>
            <td>${item.name}</td>
            <td>${item.employeeId}</td>
            <td>${item.branch}</td>
            <td><span class="status ${item.status === 'Active' ? 'success' : item.status === 'Late' ? 'warning' : 'danger'}">${item.status}</span></td>
          </tr>
        `).join('');

        document.getElementById('alerts-list').innerHTML = (metricsData.alerts || []).map((item) => `<li>${item}</li>`).join('');
      };

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;

        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, password })
        });

        const data = await response.json();
        if (!response.ok) {
          alert(data.error || 'Login failed');
          return;
        }

        if (data.user.role !== 'employer') {
          alert('Use the employer portal with employer credentials');
          return;
        }

        setAuthState(data.token);
        loadDashboard();
      });

      if (localStorage.getItem(tokenKey)) {
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        loadDashboard();
      }
    </script>
  </body>
</html>
