<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendancePro | Employee Portal</title>
    <style>
      body { font-family: Arial, sans-serif; background: #f7f9fb; margin: 0; }
      .auth-wrap { min-height: 100vh; display: grid; place-items: center; }
      .card { width: min(420px, calc(100% - 24px)); background: white; border: 1px solid #e0e3e5; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
      input, button { width: 100%; padding: 12px 14px; border-radius: 10px; margin-top: 8px; border: 1px solid #d6d9dd; }
      button { background: #004ac6; color: white; border: none; font-weight: 700; cursor: pointer; }
      .hidden { display: none; }
      .dashboard { max-width: 1000px; margin: 0 auto; padding: 24px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .panel { background: white; border: 1px solid #e0e3e5; border-radius: 12px; padding: 20px; }
      .status { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
      .success { background: rgba(16, 185, 129, 0.12); color: #10b981; }
      .warning { background: rgba(188, 72, 0, 0.12); color: #bc4800; }
      .danger { background: rgba(186, 26, 26, 0.12); color: #ba1a1a; }
      .clock-button { width: 180px; height: 180px; border-radius: 50%; background: #004ac6; color: white; border: none; font-size: 22px; font-weight: 700; cursor: pointer; }
      .clock-button.clocked { background: #10b981; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #e0e3e5; padding: 10px 8px; text-align: left; }
    </style>
  </head>
  <body>
    <div id="login-screen" class="auth-wrap">
      <div class="card">
        <h1>AttendancePro</h1>
        <p>Employee Portal</p>
        <form id="login-form">
          <label>Employee ID</label>
          <input id="userId" type="text" value="EMP-0000" required />

          <label style="display:block; margin-top: 14px;">Password</label>
          <input id="password" type="password" value="password" required />

          <button type="submit" style="margin-top: 18px;">Sign In</button>
        </form>
      </div>
    </div>

    <div id="dashboard-screen" class="dashboard hidden">
      <h1>Dashboard</h1>
      <div class="grid">
        <div class="panel">
          <div class="status success">GPS Status</div>
          <h2 id="branch-name">--</h2>
          <p id="branch-address">--</p>
          <p id="gps-status">--</p>
        </div>

        <div class="panel">
          <div class="status success">Shift Start</div>
          <h2 id="shift-start">09:00 AM</h2>
          <p>Expected</p>
        </div>
      </div>

      <div style="display:grid; place-items:center; margin: 24px 0;">
        <button id="clock-button" class="clock-button" type="button">CLOCK IN</button>
      </div>

      <div class="panel">
        <h3>Recent Attendance</h3>
        <table>
          <thead>
            <tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>

    <script>
      const API_URL = window.API_URL || 'http://localhost:4000';
      const tokenKey = 'attendance_employee_token';
      const userKey = 'attendance_employee_user';

      const loginScreen = document.getElementById('login-screen');
      const dashboardScreen = document.getElementById('dashboard-screen');
      const loginForm = document.getElementById('login-form');
      const clockButton = document.getElementById('clock-button');
      const historyBody = document.getElementById('history-body');

      const branchName = document.getElementById('branch-name');
      const branchAddress = document.getElementById('branch-address');
      const gpsStatus = document.getElementById('gps-status');

      const setAuthState = (token, user) => {
        localStorage.setItem(tokenKey, token);
        localStorage.setItem(userKey, JSON.stringify(user));
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
      };

      const loadDashboard = async () => {
        const token = localStorage.getItem(tokenKey);
        if (!token) return;

        const response = await fetch(`${API_URL}/api/employee/dashboard`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await response.json();
        if (!response.ok) {
          console.error(data.error);
          return;
        }

        branchName.textContent = data.dashboard.branch;
        branchAddress.textContent = data.dashboard.address;
        gpsStatus.textContent = data.dashboard.gpsStatus;

        clockButton.classList.toggle('clocked', data.dashboard.clockedIn);
        clockButton.textContent = data.dashboard.clockedIn ? 'CLOCKED IN' : 'CLOCK IN';

        const historyResponse = await fetch(`${API_URL}/api/employee/history`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        const historyData = await historyResponse.json();
        historyBody.innerHTML = (historyData.records || []).map((item) => `
          <tr>
            <td>${item.date}</td>
            <td>${item.checkIn}</td>
            <td>${item.checkOut}</td>
            <td><span class="status ${item.status === 'Late' ? 'warning' : 'success'}">${item.status}</span></td>
          </tr>
        `).join('');
      };

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;

        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, password })
        });

        const data = await response.json();
        if (!response.ok) {
          alert(data.error || 'Login failed');
          return;
        }

        if (data.user.role !== 'employee') {
          alert('Use the employee portal with employee credentials');
          return;
        }

        setAuthState(data.token, data.user);
        loadDashboard();
      });

      clockButton.addEventListener('click', async () => {
        const token = localStorage.getItem(tokenKey);
        if (!token) return;

        const response = await fetch(`${API_URL}/api/employee/checkin`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await response.json();
        if (response.ok) {
          clockButton.classList.toggle('clocked', data.clockedIn);
          clockButton.textContent = data.clockedIn ? 'CLOCKED IN' : 'CLOCK IN';
        }
      });

      const token = localStorage.getItem(tokenKey);
      if (token) {
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        loadDashboard();
      }
    </script>
  </body>
</html>
