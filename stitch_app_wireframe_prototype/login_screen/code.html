<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>AttendancePro - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#0053db",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface-container": "#eceef0",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#57657a",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-variant": "#e0e3e5",
                        "outline-variant": "#c3c6d7",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#0d1c2e",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-primary-container": "#eeefff",
                        "inverse-primary": "#b4c5ff",
                        "on-surface-variant": "#434655",
                        "outline": "#737686",
                        "on-surface": "#191c1e",
                        "secondary": "#515f74",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#d5e3fc",
                        "on-tertiary-container": "#ffede6",
                        "primary": "#004ac6",
                        "surface-container-high": "#e6e8ea",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "inverse-on-surface": "#eff1f3",
                        "background": "#f7f9fb",
                        "secondary-container": "#d5e3fc",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-highest": "#e0e3e5",
                        "on-primary-fixed": "#00174b",
                        "on-primary": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "primary-container": "#2563eb",
                        "tertiary-container": "#bc4800",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed-variant": "#3a485b",
                        "primary-fixed": "#dbe1ff",
                        "on-tertiary-fixed": "#360f00",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#943700",
                        "on-background": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xs": "8px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px",
                        "gutter-mobile": "12px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-md-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "status-code": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-md-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "status-code": ["13px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            position: relative;
            isolation: isolate;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(247, 249, 251, 0.55), rgba(247, 249, 251, 0.55)),
                url("../../images/credit-solutions-logo.png") center / contain no-repeat fixed;
            opacity: 1;
            z-index: -1;
        }
        .input-field {
            @apply w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 font-body-md;
        }
        .input-label {
            @apply block mb-xs font-label-caps text-on-surface-variant uppercase tracking-wider;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col justify-center items-center p-margin-mobile">
<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg space-y-xl relative overflow-hidden">
<!-- Decorative Header Background -->
<div class="absolute top-0 left-0 w-full h-24 bg-surface-container-low border-b border-outline-variant -z-10"></div>
<!-- Header / Logo -->
<div class="text-center pt-xs">
<div class="w-16 h-16 mx-auto bg-primary rounded-xl flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">
                    location_on
                </span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">AttendancePro</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Employee Portal</p>
</div>
<!-- Login Form -->
<form class="space-y-lg" id="login-form">
<div class="space-y-md">
<div>
<label class="input-label" for="employee-id">Employee ID</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">badge</span>
</span>
<input class="input-field pl-10 font-status-code text-status-code" id="employee-id" placeholder="EMP-0000" required="" type="text">
</div>
</div>
<div>
<label class="input-label" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</span>
<input class="input-field pl-10" id="password" placeholder="••••••••" required="" type="password">
</div>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Remember me
                    </label>
</div>
<div class="text-sm">
<a class="font-body-md text-body-md font-medium text-primary hover:text-primary-container transition-colors" href="#">
                        Forgot password?
                    </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-caps text-label-caps text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 uppercase tracking-widest h-12 items-center" type="submit">
                    Sign In
                    <span class="material-symbols-outlined ml-2 text-sm">login</span>
</button>
</div>
</form>
<script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();
        window.location.href = '../attendance_dashboard/code.html';
    });
</script>
<!-- Footer Info -->
<div class="text-center pt-md border-t border-outline-variant">
<p class="font-body-md text-[12px] text-on-surface-variant">
                Secure access requires location permissions.<br>
                Contact HR for access issues.
            </p>
</div>
</div>
</body></html>
