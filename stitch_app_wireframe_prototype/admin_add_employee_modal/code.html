<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Add Employee Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdbcd",
                        "primary": "#004ac6",
                        "on-surface-variant": "#434655",
                        "tertiary-fixed-dim": "#ffb596",

                        "surface-tint": "#0053db",
                        "on-tertiary-fixed": "#360f00",
                        "secondary-container": "#d5e3fc",
                        "inverse-primary": "#b4c5ff",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "tertiary": "#943700",
                        "secondary-fixed": "#d5e3fc",
                        "surface-container-highest": "#e0e3e5",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-primary-fixed": "#00174b",
                        "on-tertiary-container": "#ffede6",
                        "surface-container-low": "#f2f4f6",
                        "background": "#f7f9fb",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#57657a",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-secondary-fixed-variant": "#3a485b",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-primary-container": "#eeefff",
                        "outline-variant": "#c3c6d7",
                        "surface-bright": "#f7f9fb",
                        "surface-variant": "#e0e3e5",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-error-container": "#93000a",
                        "outline": "#737686",
                        "surface": "#f7f9fb",
                        "secondary": "#515f74",
                        "primary-fixed": "#dbe1ff",
                        "inverse-surface": "#2d3133",
                        "on-surface": "#191c1e",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef0",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sm": "12px",
                        "lg": "24px",
                        "md": "16px",
                        "gutter-mobile": "12px",
                        "xl": "32px",
                        "xs": "8px",
                        "base": "4px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Hanken Grotesk"],
                        "headline-md-mobile": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "status-code": ["JetBrains Mono"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-md-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "status-code": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-family: 'Material Symbols Outlined'; }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden font-body-md">
<!-- Background Screen (Simulated Directory) -->
<div class="absolute inset-0 z-0 overflow-hidden blur-[2px] pointer-events-none opacity-50">
<img alt="Employees Directory Screen Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjPt3D8Sw7_iQa0-v83UDK9mTTPQ2z2WkBwH5s2hRJ9u8od-88JJnI6rszdbQ8eYlFJogR50fcmL7ZrtqFCjbsYc4RqE9XhIuLwNJlKWrXv9mQLSTB-ICcrYwZ_d1GMUjqxdB70OOy0qpwDaMXOBzgdYwlCGZ2qvd9YbmzOkwb5Q6bdxaq9q6SWKdgpXhLwiPdzkPUdH3Pu1CI35tNqUBu5waMhnLqSnvEQ9DfCfaJYx-mH2ABH8Oh0Q">
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-[#191c1e]/60 backdrop-blur-sm p-lg">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-lg border border-outline-variant overflow-hidden flex flex-col max-h-full">
<!-- Modal Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Add New Employee</h2>
<button aria-label="Close Modal" class="text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="p-lg overflow-y-auto flex-1">
<form class="space-y-lg">
<!-- Profile Picture Upload Area -->
<div class="flex flex-col items-center justify-center space-y-xs">
<div class="w-24 h-24 rounded-full border border-dashed border-outline-variant bg-surface-container-low flex items-center justify-center cursor-pointer hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-outline" data-icon="add_a_photo">add_a_photo</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Upload Photo</span>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Full Name -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Full Name</label>
<input class="px-sm py-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-on-surface placeholder:font-status-code placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Jane Doe" type="text">
</div>
<!-- Employee ID (Auto-generated placeholder) -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Employee ID</label>
<input class="px-sm py-sm border border-outline-variant rounded bg-surface-container-low font-status-code text-status-code text-on-surface-variant cursor-not-allowed" disabled="" type="text" value="EMP-84920">
<span class="text-[10px] text-outline">Auto-generated</span>
</div>
<!-- Email Address -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Email Address</label>
<input class="px-sm py-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-on-surface placeholder:font-status-code placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="jane.doe@company.com" type="email">
</div>
<!-- Phone Number -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Phone Number</label>
<input class="px-sm py-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-on-surface placeholder:font-status-code placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" placeholder="+1 (555) 000-0000" type="tel">
</div>
<!-- Department -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Department</label>
<div class="relative">
<select class="appearance-none w-full px-sm py-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
<option class="font-status-code text-outline-variant" disabled="" selected="" value="">Select Department</option>
<option value="engineering">Engineering</option>
<option value="operations">Operations</option>
<option value="analytics">Analytics</option>
<option value="hr">Human Resources</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Branch -->
<div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Branch</label>
<div class="relative">
<select class="appearance-none w-full px-sm py-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">
<option class="font-status-code text-outline-variant" disabled="" selected="" value="">Select Branch</option>
<option value="hq-north">HQ - North</option>
<option value="hq-south">HQ - South</option>
<option value="westside">Westside</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div><div class="flex flex-col space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Password</label>
<input class="px-sm py-sm border border-outline-variant rounded bg-surface-container-low font-status-code text-status-code text-on-surface-variant cursor-not-allowed" disabled="" type="text" value="••••••••">
<span class="text-[10px] text-outline">Auto-generated for the new employee</span>
</div>
<!-- Role -->
<div class="flex flex-col space-y-xs md:col-span-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase">Role</label>
<div class="flex gap-md">
<label class="flex items-center gap-xs cursor-pointer">
<input checked="" class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant focus:ring-primary" name="role" type="radio" value="employee">
<span class="font-body-md text-on-surface">Employee</span>
</label>
<label class="flex items-center gap-xs cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant focus:ring-primary" name="role" type="radio" value="manager">
<span class="font-body-md text-on-surface">Manager</span>
</label>
<label class="flex items-center gap-xs cursor-pointer">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant focus:ring-primary" name="role" type="radio" value="admin">
<span class="font-body-md text-on-surface">Admin</span>
</label>
</div>
</div>
</div>
</form>
</div>
<!-- Modal Actions -->
<div class="flex items-center justify-end gap-md px-lg py-md border-t border-outline-variant bg-surface-container-lowest">
<button class="px-lg py-[10px] border border-outline-variant rounded text-on-surface font-body-md hover:bg-surface-container-low transition-colors active:opacity-80" type="button">Cancel</button>
<button class="px-lg py-[10px] bg-primary text-on-primary rounded font-body-md hover:opacity-90 transition-opacity active:opacity-80" type="button">Add Employee</button>
</div>
</div>
</div>


</body></html>
