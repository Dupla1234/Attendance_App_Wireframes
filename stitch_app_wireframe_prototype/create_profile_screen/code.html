<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-lg text-body-lg">
<!-- TopAppBar from JSON -->
<header class="bg-surface dark:bg-surface-dim w-full top-0 sticky border-b border-outline-variant dark:border-outline z-50">
<div class="flex items-center px-margin-mobile h-16 w-full max-w-[640px] mx-auto gap-md">
<button aria-label="Go back" class="hover:bg-surface-container-low transition-colors active:opacity-80 p-2 rounded-full -ml-2 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary flex-1 truncate">Create Profile</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[640px] mx-auto px-margin-mobile py-lg flex flex-col gap-xl">
<!-- Profile Picture Upload -->
<section class="flex flex-col items-center justify-center gap-sm">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center overflow-hidden transition-all group-hover:border-primary group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-4xl text-on-surface-variant group-hover:text-primary transition-colors">person</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-1 border-2 border-background shadow-sm">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">UPLOAD PHOTO</span>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-lg w-full">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface" for="fullName">FULL NAME</label>
<div class="relative">
<input class="w-full h-12 bg-surface rounded-DEFAULT border border-outline-variant px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:font-status-code placeholder:text-status-code placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="Jane Doe" type="text">
</div>
</div>
<!-- Employee ID Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface" for="employeeId">EMPLOYEE ID</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant pointer-events-none">badge</span>
<input class="w-full h-12 bg-surface rounded-DEFAULT border border-outline-variant pl-10 pr-md py-sm font-status-code text-status-code text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors uppercase tracking-wider" id="employeeId" placeholder="EMP-12345" type="text">
</div>
</div>
<!-- Assigned Branch Select -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface" for="assignedBranch">ASSIGNED BRANCH</label>
<div class="relative">
<select class="w-full h-12 bg-surface rounded-DEFAULT border border-outline-variant px-md py-sm font-body-lg text-body-lg text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="assignedBranch">
<option class="font-status-code text-outline" disabled="" selected="" value="">Select Branch...</option>
<option value="hq">Headquarters (NYC)</option>
<option value="lon">London Office</option>
<option value="sfo">San Francisco Hub</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Department Select -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface" for="department">DEPARTMENT</label>
<div class="relative">
<select class="w-full h-12 bg-surface rounded-DEFAULT border border-outline-variant px-md py-sm font-body-lg text-body-lg text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="department">
<option class="font-status-code text-outline" disabled="" selected="" value="">Select Department...</option>
<option value="eng">Engineering</option>
<option value="des">Design</option>
<option value="hr">Human Resources</option>
<option value="ops">Operations</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</section>
<!-- Spacer to push button to bottom if screen is tall -->
<div class="flex-1 min-h-[48px]"></div>
<!-- Primary Action Button -->
<div class="w-full pb-margin-mobile">
<button class="w-full h-12 bg-primary text-on-primary rounded-full font-headline-sm text-headline-sm flex items-center justify-center gap-sm hover:bg-primary-fixed-variant transition-colors active:scale-95 duration-100 shadow-sm">
                Save &amp; Continue
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar suppressed due to linear setup intent -->
</body></html>
